<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多棋盤限時搶子井字遊戲 v8.0</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 16px; background: #f4f6f9; color: #333; box-sizing: border-box; }
  * { box-sizing: border-box; }
  
  /* 遊戲頂部大標題列 */
  .game-title-header { background: linear-gradient(135deg, #0056b3, #004494); color: white; padding: 16px 20px; border-radius: 10px; margin-bottom: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.12); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
  .game-title-header h1 { margin: 0; font-size: 22px; display: flex; align-items: center; gap: 10px; }
  .version-badge { background: rgba(255, 255, 255, 0.2); padding: 4px 10px; border-radius: 20px; font-size: 13px; font-weight: 500; border: 1px solid rgba(255,255,255,0.4); }

  .panel { background: white; padding: 14px 16px; border-radius: 8px; margin-bottom: 16px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
  h3 { margin-top: 0; margin-bottom: 12px; color: #2c3e50; border-bottom: 1px solid #eee; padding-bottom: 8px; font-size: 16px; }
  
  .scoreboard { display: flex; flex-wrap: wrap; align-items: center; gap: 15px; font-size: 16px; font-weight: bold; background: #eef6ff; padding: 10px 14px; border-radius: 6px; border-left: 5px solid #0056b3; margin-top: 12px; }
  .score-item { display: flex; align-items: center; gap: 4px; }
  
  /* 動態版型容器 */
  .boards-container { display: grid; gap: 16px; transition: all 0.3s ease; }
  
  /* 版型 A：電腦版（多欄排版） */
  .boards-container.layout-desktop {
    grid-template-columns: repeat(auto-fill, minmax(224px, 1fr));
  }

  /* 版型 B：手機版（強制每行最多 2 個棋盤） */
  .boards-container.layout-mobile {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    max-width: 100%;
    margin: 0 auto;
    gap: 10px;
  }

  .board-wrapper { 
    background: white; 
    padding: 10px; 
    border: 3px solid #333; 
    border-radius: 10px; 
    text-align: center; 
    box-shadow: 0 3px 6px rgba(0,0,0,0.08); 
    transition: all 0.2s ease; 
    width: 100%;
    overflow: hidden;
  }
  
  /* 🟢 開放棋盤：亮綠粗框 + 淡綠底色 + 綠光暈 */
  .board-wrapper.open-board { 
    border: 4px solid #198754; 
    background: #ebfaf0; 
    box-shadow: 0 0 14px rgba(25, 135, 84, 0.5); 
  }
  
  /* 🔴 倒數緊迫（紅框）：粗紅框 + 淡紅警示底色 + 呼吸閃爍光暈 */
  .board-wrapper.urgent { 
    border: 4px solid #dc3545; 
    background: #fff0f1; 
    animation: urgent-flash 0.55s infinite alternate; 
  }
  @keyframes urgent-flash {
    0% { box-shadow: 0 0 8px rgba(220, 53, 69, 0.45); transform: scale(1); }
    100% { box-shadow: 0 0 20px rgba(220, 53, 69, 0.9); transform: scale(1.01); }
  }

  /* ⏳ 一般倒數中（橘框） */
  .board-wrapper.counting-board {
    border: 4px solid #fd7e14;
    background: #fff9f2;
    box-shadow: 0 0 10px rgba(253, 126, 20, 0.35);
  }
  
  .board-title { font-size: 14px; font-weight: bold; margin-bottom: 4px; }
  
  .board-sub-status { 
    font-size: 11px; 
    font-weight: bold; 
    margin-bottom: 8px; 
    padding: 4px 6px;
    border-radius: 5px;
    min-height: 20px; 
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    line-height: 1.2;
  }
  .badge-open {
    background-color: #198754;
    color: #ffffff !important;
  }
  .badge-urgent {
    background-color: #dc3545;
    color: #ffffff !important;
  }
  .badge-counting {
    background-color: #fff3cd;
    color: #664d03;
    border: 1px solid #ffecb5;
  }
  .badge-done {
    background-color: #e9ecef;
    color: #495057;
  }
  
  /* 電腦版棋盤與格子 */
  .boards-container.layout-desktop .board { 
    display: grid; 
    grid-template-columns: repeat(3, 64px); 
    grid-template-rows: repeat(3, 64px); 
    gap: 3px; 
    background: #333; 
    border: 2px solid #333; 
    margin: 0 auto; 
    width: max-content; 
  }
  .boards-container.layout-desktop .cell { 
    background: white; 
    font-size: 28px; 
    font-weight: bold; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    cursor: pointer; 
    user-select: none; 
  }

  /* 手機版雙列排版：使用百分比寬度縮放格子，確保完美塞入雙欄且絕不超出螢幕 */
  .boards-container.layout-mobile .board { 
    display: grid; 
    grid-template-columns: repeat(3, 1fr); 
    grid-template-rows: repeat(3, 1fr); 
    gap: 2px; 
    background: #333; 
    border: 2px solid #333; 
    margin: 0 auto; 
    width: 100%; 
    aspect-ratio: 1;
  }
  .boards-container.layout-mobile .cell { 
    background: white; 
    font-size: 22px; 
    font-weight: bold; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    cursor: pointer; 
    user-select: none; 
  }

  .cell:hover { background: #f0f7ff; }
  .board.finished .cell, .board.locked .cell { cursor: not-allowed; }
  .board.finished .cell { background: #f2f2f2; }
  .board.locked .cell { background: #f8f9fa; opacity: 0.85; }
  
  /* 勝利連線高亮樣式 */
  .cell.win-cell { background-color: #fff3cd !important; box-shadow: inset 0 0 0 2px #ffc107; animation: pulse 0.8s ease-in-out; }
  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
  }

  .status-msg { font-weight: bold; color: #0056b3; margin-top: 8px; font-size: 14px; }
  .error-msg { color: #d9534f; font-size: 12px; margin-top: 6px; font
